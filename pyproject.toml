[project]
name = "stu-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mdharishsuhaib", email = "mdharishsuhaib@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
